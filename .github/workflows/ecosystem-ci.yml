# integration tests for nuxt ecosystem projects - scheduled or manual run for all suites
name: nuxt-ecosystem-ci

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  # configure corepack to be strict but not download newer versions or change anything
  COREPACK_DEFAULT_TO_LATEST: 0
  COREPACK_ENABLE_AUTO_PIN: 0
  COREPACK_ENABLE_STRICT: 1

on:
  schedule:
    - cron: '0 5 * * 1,3,5' # monday,wednesday,friday 5AM
  workflow_dispatch:
    inputs:
      refType:
        description: type of ref
        required: true
        type: choice
        options:
          - branch
          - tag
          - commit
          - release
        default: branch
      ref:
        description: nuxt ref to use
        required: true
        type: string
        default: 4.x
      nitro:
        description: the version of nitro to use
        type: choice
        options:
          - v3 nightly
          - v2 nightly
          - v2 latest
        default: v2 latest
      nitroRef:
        description: nitro branch/commit to build from source (overrides the
          published-nightly "nitro" option)
        required: false
        type: string
        default: ''
      h3Ref:
        description: h3 branch/commit to build from source
        required: false
        type: string
        default: ''
      repo:
        description: nuxt repository to use
        required: true
        type: string
        default: nuxt/nuxt
  repository_dispatch:
    types: [ ecosystem-ci ]

permissions: {}

jobs:
  test-ecosystem:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # to clone the repo
    strategy:
      matrix:
        suite:
          - starter
          - content
          - ui
          - image
          - pinia
          - examples
          - example-layers-monorepo
          - bridge
          - nuxt-com
          - vite-pwa
          - docus
          - og-image
          # histoire builds with `moduleResolution: node`, which cannot resolve vite 8's types
          # - histoire
          - elk
          - devtools
          - fonts
          - scripts
          - icon
          - cli
          - test-utils
          - module-builder
          - sanity-module
          - tailwindcss
          - sitemap
          - i18n-module
          # - werewolves-assistant
          # the app pins `@nuxt/image@^1`, which no longer typechecks against current unhead,
          # and its tests do not yet compile against v2's generic component types
          # - antoine-zanardi-portfolio
          - storybook
          - npmx
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.4
      - run: pnpm i --frozen-lockfile || pnpm i --frozen-lockfile
        id: install
      - if: ${{ !(matrix.suite == 'bridge' && (inputs.ref ||
          github.event.client_payload.ref || '4.x') == '4.x') }}
        run: >-
          pnpm test "--$REF_TYPE" "$REF" --repo "$REPO" $(if [ -n "$NITRO_REF"
          ]; then echo "--nitro-ref $NITRO_REF"; fi) $(if [ -n "$H3_REF" ]; then
          echo "--h3-ref $H3_REF"; fi) "${{ matrix.suite }}"
        id: ecosystem-ci-run
        env:
          REF_TYPE: ${{ inputs.refType || github.event.client_payload.refType || 'branch'
            }}
          REF: ${{ inputs.ref || github.event.client_payload.ref || '4.x' }}
          REPO: ${{ inputs.repo || github.event.client_payload.repo || 'nuxt/nuxt' }}
          NITRO_REF: ${{ inputs.nitroRef || '' }}
          H3_REF: ${{ inputs.h3Ref || '' }}
          NUXT_UI_PRO_TOKEN: ${{ secrets.NUXT_UI_PRO_TOKEN }}
          NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_TOKEN }}
          NITRO_VERSION: ${{ inputs.nitro || 'v2 latest' }}

      - if: always() && steps.install.outcome == 'success' && !(matrix.suite == 'bridge'
          && (inputs.ref || github.event.client_payload.ref || '4.x') == '4.x')
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning
          discord-webhook.ts
        env:
          WORKFLOW_NAME: ci
          REF_TYPE: ${{ inputs.refType || github.event.client_payload.refType || 'branch'
            }}
          REF: ${{ inputs.ref || github.event.client_payload.ref || '4.x' }}
          REPO: ${{ inputs.repo || github.event.client_payload.repo || 'nuxt/nuxt' }}
          SUITE: ${{ matrix.suite }}
          STATUS: ${{ job.status }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

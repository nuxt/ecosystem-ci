# integration tests for nuxt ecosystem - single run of selected testsuite
name: nuxt-ecosystem-ci-selected

env:
  # 7 GiB by default on GitHub, setting to 6 GiB
  # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
  NODE_OPTIONS: --max-old-space-size=6144
  # configure corepack to be strict but not download newer versions or change anything
  COREPACK_DEFAULT_TO_LATEST: 0
  COREPACK_ENABLE_AUTO_PIN: 0
  COREPACK_ENABLE_STRICT: 1

on:
  workflow_dispatch:
    inputs:
      refType:
        description: type of nuxt ref to use
        required: true
        type: choice
        options:
          - branch
          - tag
          - commit
          - release
        default: branch
      ref:
        description: nuxt ref to use
        required: true
        type: string
        default: 4.x
      nitro:
        description: the version of nitro to use
        type: choice
        options:
          - v3 nightly
          - v2 nightly
          - v2 latest
        default: v2 latest
      nitroRef:
        description: nitro branch/commit to build from source (overrides the
          published-nightly "nitro" option)
        required: false
        type: string
        default: ''
      h3Ref:
        description: h3 branch/commit to build from source
        required: false
        type: string
        default: ''
      repo:
        description: nuxt repository to use
        required: true
        type: string
        default: nuxt/nuxt
      buildFromSource:
        description: ignore any pkg.pr.new build and build nuxt from source
        required: false
        default: false
        type: boolean
      suite:
        description: testsuite to run
        required: true
        type: choice
        options:
          - starter
          - content
          - ui
          - image
          - pinia
          - examples
          - example-layers-monorepo
          - bridge
          - nuxt-com
          - vite-pwa
          - docus
          - og-image
          # histoire builds with `moduleResolution: node`, which cannot resolve vite 8's types
          # - histoire
          - elk
          - devtools
          - fonts
          - scripts
          - icon
          - cli
          - test-utils
          - module-builder
          - sanity-module
          - tailwindcss
          - sitemap
          - i18n-module
          # - werewolves-assistant
          # the app pins `@nuxt/image@^1`, which no longer typechecks against current unhead,
          # and its tests do not yet compile against v2's generic component types
          # - antoine-zanardi-portfolio
          - storybook
          - npmx

permissions: {}

jobs:
  execute-selected-suite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # to clone the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.4
      - run: pnpm i --frozen-lockfile || pnpm i --frozen-lockfile
        id: install
      - run: >-
          pnpm test "--$REF_TYPE" "$REF" --repo "$REPO" $(if [ -n "$NITRO_REF"
          ]; then echo "--nitro-ref $NITRO_REF"; fi) $(if [ -n "$H3_REF" ]; then
          echo "--h3-ref $H3_REF"; fi) "${{ inputs.suite }}"
        id: ecosystem-ci-run
        env:
          REF_TYPE: ${{ inputs.refType }}
          REF: ${{ inputs.ref }}
          REPO: ${{ inputs.repo }}
          NITRO_REF: ${{ inputs.nitroRef }}
          H3_REF: ${{ inputs.h3Ref }}
          NUXT_UI_PRO_TOKEN: ${{ secrets.NUXT_UI_PRO_TOKEN }}
          NUXT_UI_PRO_LICENSE: ${{ secrets.NUXT_UI_PRO_TOKEN }}
          NITRO_VERSION: ${{ inputs.nitro }}
          SKIP_PKG_PR_NEW: ${{ inputs.buildFromSource && '1' || '' }}
      - if: always() && steps.install.outcome == 'success'
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning
          discord-webhook.ts
        env:
          WORKFLOW_NAME: ci-selected
          REF_TYPE: ${{ inputs.refType }}
          REF: ${{ inputs.ref }}
          REPO: ${{ inputs.repo }}
          SUITE: ${{ inputs.suite }}
          STATUS: ${{ job.status }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
